# The maps under "by water": region (a map) > area (a mark on it).
# Outings say which area and water they were in (`area:` and `water:` in each outing), and each area's
# rivers and lakes are drawn from those, so a new or renamed river needs no change here.
#   at:      [lat, lon] for an area's mark on the map
#   label:   which side of the mark its name goes on (right by default; left, above or below)
#   waters:  optional, only for a water worth a dot on the map, or one whose kind can't be guessed
#            from its name (names with "lake" draw as a lake; "creek" or "stream" as a creek;
#            "offshore", "charter" or "sea" as the sea; anything else as a river)

- region: Hokkaido
  map: hokkaido
  areas:
    - name: Rebun
      at: [45.38, 141.03]
    - name: Sapporo
      at: [43.06, 141.35]
    - name: Niseko
      at: [42.86, 140.69]
      label: left
    - name: Tokachi
      at: [42.92, 143.20]
      label: below
      waters:
        - name: Otofuke River
          at: [43.10, 143.20]
        - name: Lake Shikaribetsu
          at: [43.28, 143.11]
    - name: Akan
      at: [43.43, 144.09]
      label: left
      waters:
        - name: Akan River
          at: [43.25, 144.17]
    - name: Teshikaga
      at: [43.49, 144.46]
      waters:
        - name: Lake Kussharo
          at: [43.62, 144.34]
    - name: Abashiri
      at: [44.02, 144.27]

- region: Oahu
  map: oahu
  areas:
    - name: Kailua
      at: [21.40, -157.74]
      label: left
